name: Print Shop Job Manager TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD PRINT SHOP to confirm upload
        required: true
        type: string
  workflow_call:
    inputs:
      confirmation:
        required: true
        type: string
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_P12:
        required: true
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: print-shop-job-manager-testflight
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: com.worksbienstudios.printshopjobmanager
  APPLE_TEAM_ID: 49SQ3XQ68Q
  APP_NAME: Print Shop Job Manager
  APP_SKU: print-shop-job-manager-ios
  PROVISIONING_PROFILE_NAME: Print Shop Job Manager App Store CI
  SCHEME: Shell
  ARCHIVE_PATH: ${{ github.workspace }}/build/PrintShopJobManager.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  upload:
    if: inputs.confirmation == 'UPLOAD PRINT SHOP'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          repository: lrodeveloperr/Printshop-ios
          ref: main
      - name: Confirm trigger
        run: |
          [[ "${{ inputs.confirmation }}" == "UPLOAD PRINT SHOP" ]] || { echo 'Confirmation must exactly match UPLOAD PRINT SHOP.' >&2; exit 1; }
          build_number="$(date -u +%y%m%d%H%M).${GITHUB_RUN_NUMBER}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - name: Validate build and Run unit tests before upload
        run: |
          python3 scripts/generate-localizations.py
          scripts/validate-shell.sh --release
          git diff --exit-code -- Shell/Resources
          xcodegen generate
          xcodebuild -project Shell.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" build
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |d| d["isAvailable"] && d["name"].start_with?("iPhone") }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project Shell.xcodeproj -scheme "$SCHEME" -configuration Release -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -only-testing:ShellTests test
      - name: Prepare App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          (( ${#missing[@]} == 0 )) || { echo "Missing Actions secrets: ${missing[*]}" >&2; exit 1; }
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Ensure bundle ID and private App Store record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          jwt="$(ruby scripts/app-store-connect-jwt.rb "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          echo "ASC_JWT=$jwt" >> "$GITHUB_ENV"
          auth="Authorization: Bearer $jwt"

          bundle_json="$RUNNER_TEMP/bundle.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$bundle_json")"
          if [[ "$count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"bundleIds",attributes:{identifier:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),platform:"IOS"}})' > "$RUNNER_TEMP/create-bundle.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-bundle.json" 'https://api.appstoreconnect.apple.com/v1/bundleIds' -o "$bundle_json"
          elif [[ "$count" != "1" ]]; then
            echo 'Bundle ID lookup was ambiguous.' >&2; exit 1
          fi
          bundle_resource_id="$(ruby -rjson -e 'd=JSON.parse(File.read(ARGV[0])).fetch("data"); d=d.fetch(0) if d.is_a?(Array); puts d.fetch("id")' "$bundle_json")"
          echo "BUNDLE_RESOURCE_ID=$bundle_resource_id" >> "$GITHUB_ENV"

          app_json="$RUNNER_TEMP/app.json"
          curl --fail-with-body --silent --show-error --get -H "$auth" --data-urlencode "filter[bundleId]=$IOS_BUNDLE_ID" --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          app_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$app_json")"
          if [[ "$app_count" == "0" ]]; then
            ruby -rjson -e 'puts JSON.generate(data:{type:"apps",attributes:{bundleId:ENV.fetch("IOS_BUNDLE_ID"),name:ENV.fetch("APP_NAME"),primaryLocale:"en-US",sku:ENV.fetch("APP_SKU")}})' > "$RUNNER_TEMP/create-app.json"
            curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-app.json" 'https://api.appstoreconnect.apple.com/v1/apps' -o "$app_json"
          elif [[ "$app_count" != "1" ]]; then
            echo 'App lookup was ambiguous.' >&2; exit 1
          fi
          app_resource_id="$(ruby -rjson -e 'd=JSON.parse(File.read(ARGV[0])).fetch("data"); d=d.fetch(0) if d.is_a?(Array); puts d.fetch("id")' "$app_json")"
          echo "APP_RESOURCE_ID=$app_resource_id" >> "$GITHUB_ENV"
      - name: Install distribution certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_P12" ]] || { echo 'Missing Actions secret: IOS_DISTRIBUTION_CERTIFICATE_P12' >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo 'Missing Actions secret: IOS_DISTRIBUTION_CERTIFICATE_PASSWORD' >&2; exit 1; }

          cert_path="$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 --decode > "$cert_path"
          chmod 600 "$cert_path"
          cert_serial="$(openssl pkcs12 -in "$cert_path" -passin pass:"$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -clcerts -nokeys 2>/dev/null | openssl x509 -noout -serial | cut -d= -f2 | tr '[:lower:]' '[:upper:]')"
          [[ -n "$cert_serial" ]] || { echo 'Could not read distribution certificate serial number.' >&2; exit 1; }

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path" | grep 'Apple Distribution'

          profile_json="$RUNNER_TEMP/profiles.json"
          curl --fail-with-body --silent --show-error --get -H "Authorization: Bearer $ASC_JWT" --data-urlencode "filter[name]=$PROVISIONING_PROFILE_NAME" --data-urlencode 'filter[profileState]=ACTIVE' --data-urlencode 'limit=2' 'https://api.appstoreconnect.apple.com/v1/profiles' -o "$profile_json"
          profile_count="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("data").length' "$profile_json")"
          if [[ "$profile_count" == "0" ]]; then
            certificates_json="$RUNNER_TEMP/certificates.json"
            curl --fail-with-body --silent --show-error --get -H "Authorization: Bearer $ASC_JWT" --data-urlencode 'limit=200' 'https://api.appstoreconnect.apple.com/v1/certificates' -o "$certificates_json"
            certificate_resource_id="$(CERT_SERIAL="$cert_serial" ruby -rjson -e 'serial=ENV.fetch("CERT_SERIAL"); item=JSON.parse(File.read(ARGV[0])).fetch("data").find{|x| x.dig("attributes","serialNumber").to_s.upcase==serial}; abort "Imported distribution certificate was not found in App Store Connect" unless item; puts item.fetch("id")' "$certificates_json")"
            BUNDLE_RESOURCE_ID="$BUNDLE_RESOURCE_ID" CERTIFICATE_RESOURCE_ID="$certificate_resource_id" ruby -rjson -e 'puts JSON.generate(data:{type:"profiles",attributes:{name:ENV.fetch("PROVISIONING_PROFILE_NAME"),profileType:"IOS_APP_STORE"},relationships:{bundleId:{data:{type:"bundleIds",id:ENV.fetch("BUNDLE_RESOURCE_ID")}},certificates:{data:[{type:"certificates",id:ENV.fetch("CERTIFICATE_RESOURCE_ID")} ]}}})' > "$RUNNER_TEMP/create-profile.json"
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $ASC_JWT" -H 'Content-Type: application/json' -d @"$RUNNER_TEMP/create-profile.json" 'https://api.appstoreconnect.apple.com/v1/profiles' -o "$profile_json"
          elif [[ "$profile_count" != "1" ]]; then
            echo "Profile lookup was ambiguous for $PROVISIONING_PROFILE_NAME." >&2; exit 1
          fi

          profile_path="$RUNNER_TEMP/app-store.mobileprovision"
          ruby -rjson -rbase64 -e 'd=JSON.parse(File.read(ARGV[0])).fetch("data"); d=d.fetch(0) if d.is_a?(Array); print Base64.decode64(d.fetch("attributes").fetch("profileContent"))' "$profile_json" > "$profile_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          [[ "$profile_name" == "$PROVISIONING_PROFILE_NAME" ]]
          [[ "$app_identifier" == "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          chmod 600 "$profile_dir/$profile_uuid.mobileprovision"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Archive unsigned app
        run: |
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          xcodebuild -project Shell.xcodeproj -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" clean archive
          app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          while IFS= read -r -d '' framework; do codesign --force --sign - --timestamp=none "$framework"; done < <(find "$app/Frameworks" -depth -type d -name '*.framework' -print0 2>/dev/null || true)
      - name: Export and verify signed IPA
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string "Apple Distribution"' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROVISIONING_PROFILE_NAME" "$export_options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$export_options"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          ditto -x -k "$IPA_PATH" "$verify"
          app="$(find "$verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist")" == "false" ]]
      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: Print-Shop-Job-Manager-TestFlight-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
