name: iOS validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: print-shop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
      - name: Validate product source
        run: |
          python3 scripts/generate-localizations.py
          scripts/validate-shell.sh --release
          git diff --exit-code -- Shell/Resources
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Shell.xcodeproj -scheme Shell -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |d| d["isAvailable"] && d["name"].start_with?("iPhone") }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project Shell.xcodeproj -scheme Shell -configuration Release -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES -only-testing:ShellTests test
